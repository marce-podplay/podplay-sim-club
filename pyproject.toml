[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "podplay-sim-club"
version = "0.1.0"
description = "A persistent fictional PodPlay tenant for safe preview exploration"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
club = "podplay_sim_club.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
podplay_sim_club = ["templates/*.html"]
